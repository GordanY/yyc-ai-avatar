name: Student demo and GitHub Pages
on:
  push:
    branches: [main]
    paths: ['student/**', '.github/workflows/student-pages.yml', 'public/vrm/YYC_InfoDay.vrm', 'public/animations/yyc/**']
  pull_request:
    paths: ['student/**', '.github/workflows/student-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: student-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch only the school model from Git LFS
        run: git lfs pull --include="public/vrm/YYC_InfoDay.vrm"
      - name: Install isolated student dependencies
        working-directory: student
        run: npm install --no-audit --no-fund
      - name: Check quota, limits and context logic
        working-directory: student
        run: npm test
      - name: Build the static student app
        working-directory: student
        run: npm run build
      - name: Install Chromium
        working-directory: student
        run: npx playwright install --with-deps chromium
      - name: Verify interactions, real VRM loading and responsive screenshots
        working-directory: student
        run: npx playwright test
      - name: Save screenshots and browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-ui-review
          path: |
            student/test-results/
            student/playwright-report/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish student demo
        id: deployment
        uses: actions/deploy-pages@v4
